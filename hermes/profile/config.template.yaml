# Template copy of the installable ran-assistant Hermes config.
# Copy to a machine-local profile config only if you are not using
# `hermes profile install`.

model:
  provider: deepseek
  default: deepseek-v4-flash

mcp_servers:
  time:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_time_mcp.sh']
    env:
      LOCAL_TIMEZONE: Asia/Shanghai
  media_generation:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_generation_mcp.sh']
    timeout: 300
  media_reader:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_reader_mcp.sh']
    timeout: 300
  social_reader:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_social_reader_mcp.sh']
    timeout: 300
  obsidian_memory:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_obsidian_memory_mcp.sh']
  personal_memory:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_personal_memory_mcp.sh']
  co_reading:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_co_reading_mcp.sh']
  playwright:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_playwright_mcp.sh']
