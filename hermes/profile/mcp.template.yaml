# Hermes MCP template.
# The active installable config lives in config.yaml under `mcp_servers`.
# This file is a readable mapping from the current repo .mcp.json.

mcp_servers:
  playwright:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_playwright_mcp.sh']
  time:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_time_mcp.sh']
    env:
      LOCAL_TIMEZONE: Asia/Shanghai
  media_generation:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_generation_mcp.sh']
  sticker_catalog:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_sticker_catalog_mcp.sh']
  media_reader:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_reader_mcp.sh']
  social_reader:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_social_reader_mcp.sh']
  obsidian_memory:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_obsidian_memory_mcp.sh']
  personal_memory:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_personal_memory_mcp.sh']
  ombre_memory:
    url: "${OMBRE_BRAIN_MCP_URL}"
  ombre_memory_extra:
    url: "${OMBRE_BRAIN_MCP_EXTRA_URL}"
  co_reading:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_co_reading_mcp.sh']
  search_hub:
    command: bash
    args: [-lc, 'cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_search_hub_mcp.sh']

# Optional remote MCP. Add after install when TAVILY_API_KEY exists in the
# machine-local env:
# tavily:
#   url: "https://mcp.tavily.com/mcp/?tavilyApiKey=<machine-local-key>"
