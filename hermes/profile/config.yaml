# Installable Hermes profile config for ran-assistant (full gateway).
# This file is safe to commit. Put secrets in the machine-local .env file.

model:
  provider: deepseek
  default: deepseek-v4-flash

# Keep daily chat on Flash. Use the Pro template or an explicit model override
# for high-cost work:
#   hermes -p ran-assistant --provider deepseek --model deepseek-v4-pro -z "..."

disabled_tools:
  - browser_vision
  - image_generate
  - text_to_speech
  - video_analyze
  - vision_analyze

platform_toolsets:
  cli:
    - web
    - terminal
    - file
    - skills
    - memory
    - session_search
    - safe
    - mcp-time
    - mcp-social_reader
    - mcp-media_reader
    - mcp-mimo_power
    - mcp-media_generation
    - mcp-personal_memory
    - mcp-obsidian_memory
    - mcp-playwright
    - mcp-tavily
  gateway:
    - web
    - terminal
    - file
    - skills
    - memory
    - session_search
    - safe
    - mcp-time
    - mcp-social_reader
    - mcp-media_reader
    - mcp-mimo_power
    - mcp-media_generation
    - mcp-personal_memory
    - mcp-obsidian_memory
    - mcp-playwright
    - mcp-tavily

mcp_servers:
  time:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_time_mcp.sh
    env:
      LOCAL_TIMEZONE: Asia/Shanghai
    timeout: 120
    connect_timeout: 60

  media_generation:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_generation_mcp.sh
    timeout: 300
    connect_timeout: 60

  media_reader:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_reader_mcp.sh
    timeout: 300
    connect_timeout: 90

  social_reader:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_social_reader_mcp.sh
    timeout: 300
    connect_timeout: 90

  obsidian_memory:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_obsidian_memory_mcp.sh
    timeout: 180
    connect_timeout: 90

  personal_memory:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_personal_memory_mcp.sh
    timeout: 120
    connect_timeout: 60

  mimo_power:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_mimo_power_mcp.sh
    timeout: 600
    connect_timeout: 90

  playwright:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_playwright_mcp.sh
    timeout: 180
    connect_timeout: 90

# Tavily remains optional because the remote URL needs a machine-local API key.
# Add it after install with:
#   hermes -p ran-assistant mcp add tavily --url "https://mcp.tavily.com/mcp/?tavilyApiKey=$TAVILY_API_KEY"
