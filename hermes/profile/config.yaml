# Installable Hermes profile config for ran-assistant (full gateway).
# This file is safe to commit. Put secrets in the machine-local .env file.

model:
  provider: deepseek
  default: deepseek-v4-flash

# Keep daily chat on Flash. Use the Pro template or an explicit model override
# for high-cost work:
#   hermes -p ran-assistant --provider deepseek --model deepseek-v4-pro -z "..."

disabled_tools:
  - browser_vision
  - image_generate
  - text_to_speech
  - video_analyze
  - vision_analyze

platform_toolsets:
  cli:
    - web
    - terminal
    - file
    - skills
    - memory
    - session_search
    - safe
    - mcp-time
    - mcp-social_reader
    - mcp-media_reader
    - mcp-search_hub
    - mcp-co_reading
    - mcp-sticker_catalog
    - mcp-media_generation
    - mcp-personal_memory
    - mcp-obsidian_memory
    - mcp-ombre_memory
    - mcp-playwright
    - mcp-external_mcp_gateway
  gateway:
    - web
    - terminal
    - file
    - skills
    - memory
    - session_search
    - safe
    - mcp-time
    - mcp-social_reader
    - mcp-media_reader
    - mcp-search_hub
    - mcp-co_reading
    - mcp-sticker_catalog
    - mcp-media_generation
    - mcp-personal_memory
    - mcp-obsidian_memory
    - mcp-ombre_memory
    - mcp-playwright
    - mcp-external_mcp_gateway

mcp_servers:
  time:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_time_mcp.sh
    env:
      LOCAL_TIMEZONE: Asia/Shanghai
    timeout: 120
    connect_timeout: 60

  media_generation:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_generation_mcp.sh
    timeout: 1200
    connect_timeout: 60

  sticker_catalog:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_sticker_catalog_mcp.sh
    env:
      STICKER_CATALOG_PROFILE_MODE: full
      STICKER_CATALOG_ALLOW_RUNTIME_SAVE: "true"
    timeout: 120
    connect_timeout: 60

  media_reader:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_reader_mcp.sh
    timeout: 1200
    connect_timeout: 90

  social_reader:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_social_reader_mcp.sh
    timeout: 1200
    connect_timeout: 90

  obsidian_memory:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_obsidian_memory_mcp.sh
    timeout: 180
    connect_timeout: 90

  personal_memory:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_personal_memory_mcp.sh
    timeout: 120
    connect_timeout: 60

  ombre_memory:
    url: "${OMBRE_RECALL_MCP_URL}"
    timeout: 120
    connect_timeout: 30

  search_hub:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_search_hub_mcp.sh
    env:
      SEARCH_HUB_PROFILE_MODE: full
      SEARCH_HUB_ENABLE_OPENCLI_BROWSER: "false"
      SEARCH_HUB_ENABLE_PLAYWRIGHT_FALLBACK: "true"
      SEARCH_HUB_PUBLIC_ONLY_DEFAULT: "false"
    timeout: 120
    connect_timeout: 60

  co_reading:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_co_reading_mcp.sh
    timeout: 180
    connect_timeout: 60

  playwright:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_playwright_mcp.sh
    timeout: 180
    connect_timeout: 90

  external_mcp_gateway:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_external_mcp_gateway.sh
    env:
      EXTERNAL_MCP_GATEWAY_PROFILE: "full"
      EXTERNAL_MCP_GATEWAY_ENABLED: "false"
      EXTERNAL_MCP_SYSTEM_QUEUE_ENABLED: "false"
    timeout: 120
    connect_timeout: 60

# Tavily remains optional because the remote URL needs a machine-local API key.
# Add it after install with:
#   hermes -p ran-assistant mcp add tavily --url "https://mcp.tavily.com/mcp/?tavilyApiKey=$TAVILY_API_KEY"
