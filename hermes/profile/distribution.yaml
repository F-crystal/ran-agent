name: ran-assistant
version: 0.1.0
description: "ran-agent Hermes front shell using DeepSeek V4 Pro in non-thinking mode"
hermes_requires: ">=0.13.0"
author: "fengran"
license: "Private"

env_requires:
  - name: DEEPSEEK_API_KEY
    description: "DeepSeek API key for Hermes model provider"
    required: true
  - name: RAN_AGENT_REPO_ROOT
    description: "Absolute path to the ran-agent checkout"
    required: true
    default: "/Users/fengran/ran_agent"
  - name: PYTHON_BACKEND_BASE_URL
    description: "Python backend HTTP base URL"
    required: false
    default: "http://127.0.0.1:8787"
  - name: DASHSCOPE_API_KEY
    description: "DashScope key used by media_reader vision/ASR tools"
    required: false
    default: ""
  - name: QWEN_API_KEY
    description: "Qwen-compatible key used by media_reader/Python backend when enabled"
    required: false
    default: ""
  - name: OBSIDIAN_INDEX_DEVICE
    description: "Device for obsidian-index sentence-transformers backend; use cpu on Linux servers"
    required: false
    default: "cpu"
  - name: OBSIDIAN_MEMORY_INDEX_PATH
    description: "DuckDB index path for obsidian_memory semantic search"
    required: false
    default: "/Users/fengran/ran_agent/data/obsidian-memory-index.duckdb"
  - name: OBSIDIAN_MEMORY_REINDEX
    description: "Set to 1 only during explicit obsidian_memory index maintenance"
    required: false
    default: "0"
  - name: OBSIDIAN_MEMORY_WATCH
    description: "Set to 1 only when an obsidian_memory long-running watcher is desired"
    required: false
    default: "0"
  - name: TAVILY_API_KEY
    description: "Optional Tavily key for web search MCP"
    required: false
    default: ""

distribution_owned:
  - IDENTITY.md
  - SOUL.md
  - AGENTS.md
  - config.yaml
  - config.template.yaml
  - config.pro.template.yaml
  - mcp.json
  - mcp.template.yaml
  - skills/
  - plugins/
  - distribution.yaml
