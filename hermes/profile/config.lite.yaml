# ran-assistant-lite: 普通文字聊天专用，最小 MCP 集合
# 用于日常对话、社交链接读取、记忆查询，不加载重型工具

model:
  provider: deepseek
  default: deepseek-v4-flash
  model: deepseek-v4-flash
  base_url: https://api.deepseek.com/v1
  api_mode: chat_completions

web:
  search_backend: tavily
  extract_backend: tavily

compression:
  enabled: true
  threshold: 0.35
  target_ratio: 0.12
  protect_last_n: 8
  hygiene_hard_message_limit: 160

terminal:
  backend: local
  cwd: /opt/ran_agent
  timeout: 180
  lifetime_seconds: 300

disabled_tools:
  - browser_vision
  - image_generate
  - text_to_speech
  - video_analyze
  - vision_analyze
  - terminal
  - file
  - session_search
  - mcp-playwright
  - mcp-media_generation

platform_toolsets:
  cli:
    - web
    - skills
    - memory
    - safe
    - mcp-time
    - mcp-social_reader
    - mcp-media_reader
    - mcp-search_hub
    - mcp-sticker_catalog
    - mcp-personal_memory
    - mcp-obsidian_memory
    - mcp-external_mcp_gateway
  gateway:
    - web
    - skills
    - memory
    - safe
    - mcp-time
    - mcp-social_reader
    - mcp-media_reader
    - mcp-search_hub
    - mcp-sticker_catalog
    - mcp-personal_memory
    - mcp-obsidian_memory
    - mcp-external_mcp_gateway

mcp_servers:
  time:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_time_mcp.sh
    env:
      LOCAL_TIMEZONE: Asia/Shanghai
    timeout: 120
    connect_timeout: 60

  social_reader:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_social_reader_mcp.sh
    timeout: 1200
    connect_timeout: 90

  media_reader:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_media_reader_mcp.sh
    timeout: 1200
    connect_timeout: 90

  sticker_catalog:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_sticker_catalog_mcp.sh
    env:
      STICKER_CATALOG_PROFILE_MODE: lite
      STICKER_CATALOG_ALLOW_RUNTIME_SAVE: "true"
    timeout: 120
    connect_timeout: 60

  search_hub:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_search_hub_mcp.sh
    env:
      SEARCH_HUB_PROFILE_MODE: lite
      SEARCH_HUB_ENABLE_OPENCLI_BROWSER: "false"
      SEARCH_HUB_ENABLE_PLAYWRIGHT_FALLBACK: "false"
      SEARCH_HUB_PUBLIC_ONLY_DEFAULT: "true"
    timeout: 120
    connect_timeout: 60

  personal_memory:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_personal_memory_mcp.sh
    timeout: 120
    connect_timeout: 60

  obsidian_memory:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_obsidian_memory_mcp.sh
    timeout: 180
    connect_timeout: 90

  external_mcp_gateway:
    command: bash
    args:
      - -lc
      - cd "$RAN_AGENT_REPO_ROOT" && exec bash scripts/start_external_mcp_gateway.sh
    env:
      EXTERNAL_MCP_GATEWAY_ENABLED: "false"
      EXTERNAL_MCP_SYSTEM_QUEUE_ENABLED: "false"
    timeout: 120
    connect_timeout: 60

  tavily:
    url: "https://mcp.tavily.com/mcp/?tavilyApiKey=${TAVILY_API_KEY}"
    timeout: 60
    connect_timeout: 30
